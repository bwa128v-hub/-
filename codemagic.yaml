
workflows:
  android-workflow:
    name: Tahseel Android Build
    max_build_duration: 30
    environment:
      android_sdk: latest
      node: latest
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          echo "Building offline app..."
    artifacts:
      - build/**/*.apk
      - ./*.html
