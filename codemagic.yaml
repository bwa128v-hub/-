
workflows:
  android-workflow:
    name: Tahseel Android Build
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter
        script: flutter --version

      - name: Install dependencies
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
